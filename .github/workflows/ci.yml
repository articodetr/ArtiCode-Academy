# Continuous integration (S1-R02, ADR-043).
#
# Three independent jobs run on every push to `main` and on every pull request:
#
#   backend   npm ci → lint → prisma migrate deploy (migrator role) → drift guard
#             (prisma migrate diff --exit-code) → the same two steps for the platform
#             database (--config prisma.platform.config.ts, MOD-18) → seed → unit tests →
#             e2e tests (application roles) → build, against a throwaway PostgreSQL 18
#             service that gets the same least-privilege roles as local development
#             through the very same scripts (docker/postgres/initdb/10-roles.sh, ADR-019,
#             and 20-platform.sh for articode_platform).
#   frontend  npm ci → lint → test → build (tsc -b + vite build), strictly in sequence:
#             the jsdom suites must never share the CPU with tsc/build (KI-044).
#   deploy    the per-academy package (MOD-17, ADR-072): builds the api, web and backup
#             images and runs TEST-200..203 — the images, the backup container and a whole
#             throwaway academy brought up with deploy/compose.academy.yaml (CH-0214).
#
# Node comes from .nvmrc (S1-R01). Every credential below is a throwaway value for
# the CI database only: it exists nowhere else, nothing is copied from a local .env,
# and no secret of the project is needed (JWT_SECRET is optional outside production).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer run on the same branch/PR cancels the older one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (lint, migrations, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18
        env:
          # Superuser of the throwaway cluster (created by the image); used only to
          # run 10-roles.sh, exactly like the local compose setup.
          POSTGRES_USER: articode
          POSTGRES_PASSWORD: ci-only-superuser-password
          POSTGRES_DB: articode_academy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U articode -d articode_academy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # Prisma CLI (migrate deploy, migrate diff): database owner — ADR-019.
      MIGRATION_DATABASE_URL: postgresql://articode_migrator:ci-only-migrator-password@127.0.0.1:5432/articode_academy
      # Seed, runtime and e2e suites: DML-only application role — ADR-019.
      DATABASE_URL: postgresql://articode_app:ci-only-app-password@127.0.0.1:5432/articode_academy
      # The platform database (MOD-18-T01, docs 6.6.2) on the same service, with roles of
      # its own: the Prisma CLI with --config prisma.platform.config.ts as its owner, the
      # platform e2e suite (TEST-206) as its DML-only application role.
      PLATFORM_MIGRATION_DATABASE_URL: postgresql://platform_migrator:ci-only-platform-migrator-password@127.0.0.1:5432/articode_platform
      PLATFORM_DATABASE_URL: postgresql://platform_app:ci-only-platform-app-password@127.0.0.1:5432/articode_platform
      # Identity of the CI academy, written once by prisma/seed.ts (no default for
      # timezone and currency by design — CH-0012).
      SEED_ACADEMY_SLUG: ci-academy
      SEED_ACADEMY_NAME_AR: أكاديمية الاختبار
      SEED_ACADEMY_NAME_EN: CI Academy
      SEED_ACADEMY_TIMEZONE: UTC
      SEED_ACADEMY_CURRENCY: USD
      SEED_ACADEMY_LOCALE: ar
      # No Prisma CLI update checks on CI.
      CHECKPOINT_DISABLE: 1
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Create the least-privilege database roles (ADR-019)
        # Runs the repository's own role script inside the service container, where
        # psql reaches the superuser over the trusted local socket — the same path
        # the postgres image takes on the first start of the local compose volume.
        working-directory: .
        env:
          POSTGRES_USER: articode
          POSTGRES_DB: articode_academy
          DB_MIGRATOR_USER: articode_migrator
          DB_MIGRATOR_PASSWORD: ci-only-migrator-password
          DB_APP_USER: articode_app
          DB_APP_PASSWORD: ci-only-app-password
        run: |
          container='${{ job.services.postgres.id }}'
          docker cp docker/postgres/initdb/10-roles.sh "$container:/tmp/10-roles.sh"
          docker exec \
            -e POSTGRES_USER -e POSTGRES_DB \
            -e DB_MIGRATOR_USER -e DB_MIGRATOR_PASSWORD \
            -e DB_APP_USER -e DB_APP_PASSWORD \
            "$container" bash /tmp/10-roles.sh

      - name: Create the platform database and its roles (MOD-18-T01)
        # The same path for docker/postgres/initdb/20-platform.sh: articode_platform owned
        # by platform_migrator, DML for platform_app, CONNECT for those two roles only.
        working-directory: .
        env:
          POSTGRES_USER: articode
          POSTGRES_DB: articode_academy
          PLATFORM_DB_NAME: articode_platform
          PLATFORM_DB_MIGRATOR_USER: platform_migrator
          PLATFORM_DB_MIGRATOR_PASSWORD: ci-only-platform-migrator-password
          PLATFORM_DB_APP_USER: platform_app
          PLATFORM_DB_APP_PASSWORD: ci-only-platform-app-password
        run: |
          container='${{ job.services.postgres.id }}'
          docker cp docker/postgres/initdb/20-platform.sh "$container:/tmp/20-platform.sh"
          docker exec \
            -e POSTGRES_USER -e POSTGRES_DB \
            -e PLATFORM_DB_NAME \
            -e PLATFORM_DB_MIGRATOR_USER -e PLATFORM_DB_MIGRATOR_PASSWORD \
            -e PLATFORM_DB_APP_USER -e PLATFORM_DB_APP_PASSWORD \
            "$container" bash /tmp/20-platform.sh

      - name: Use npm 11 for the backend install (KI-015, KI-045)
        # Node 22.20.0 ships npm 10.9.3, which rejects the committed backend lockfile
        # ("Missing: typescript@5.9.3 from lock file": tsconfck's optional peer
        # typescript@^5 is unsatisfied by typescript 6 and npm 10 wants a nested copy
        # that npm 11 — the version that writes this lockfile — never records).
        run: |
          npm install --global npm@11
          npm --version

      - name: Install (npm ci; postinstall runs prisma generate)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Apply migrations (migrator role)
        run: npx prisma migrate deploy

      - name: Drift guard — schema.prisma must match the applied migrations
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

      - name: Apply the platform migrations (platform migrator role)
        run: npx prisma migrate deploy --config prisma.platform.config.ts

      - name: Platform drift guard — prisma/platform/schema.prisma must match its migrations
        run: npx prisma migrate diff --config prisma.platform.config.ts --from-config-datasource --to-schema prisma/platform/schema.prisma --exit-code

      - name: Seed (permission catalog, system roles, academy row)
        run: npm run prisma:seed

      - name: Unit tests
        run: npm run test

      - name: End-to-end tests (application role; one file at a time — KI-040)
        # Every e2e file boots AppModule and hashes argon2id passwords in beforeAll;
        # ten of them at once starve the OpenAPI tests on a shared CPU (KI-040), so CI
        # runs the files sequentially. Same suites, same command, no code change.
        run: npm run test:e2e -- --no-file-parallelism

      - name: Build
        run: npm run build

  frontend:
    name: frontend (lint, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests (jsdom; alone — KI-044)
        run: npm run test

      - name: Build (tsc -b && vite build)
        run: npm run build

  deploy:
    name: deploy (images, compose project, backup)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      # The deploy tests are plain Node scripts (no npm install); Node from .nvmrc.
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Docker and Compose versions
        run: docker version --format '{{.Server.Version}}' && docker compose version

      - name: Compose file is valid with the example env file
        run: docker compose -p academy-example -f deploy/compose.academy.yaml --env-file deploy/env/academy.env.example config --quiet

      # TEST-200: builds articode-api / articode-api-tools, boots runtime in production,
      # checks layers, packages and user, then migrates and seeds a throwaway PostgreSQL.
      - name: api image (TEST-200)
        run: node deploy/tests/api-image.test.mjs --tag ci

      # TEST-201: builds articode-web (Caddy + the Vite build), same origin, SPA fallback,
      # proxy headers, OriginGuard through the proxy, automatic HTTPS configuration.
      - name: web image (TEST-201)
        run: node deploy/tests/web-image.test.mjs --tag ci --api-image articode-api:ci

      # TEST-203: backup → restore, the restore drill (good, truncated and tampered dumps),
      # retention, the encrypted offsite copy, no password in a command line or a log.
      - name: backup container (TEST-203)
        run: node deploy/tests/backup.test.mjs --tag ci --tools-tag ci

      # TEST-202 (compose part): a whole throwaway academy on 127.0.0.1 — migrate, api
      # healthy, first admin and sign-in through the web origin, a second up, a failed
      # migration, schema_outdated, no published database port, no CREATEDB; then down -v
      # of that throwaway project only.
      - name: academy compose project (TEST-202)
        run: node deploy/tests/academy-compose.test.mjs --tag ci --port 18202
